name: ARQENVO browser application smoke

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "src/**"
      - "benchmarks/browser-spike/run-app-smoke.mjs"
      - ".github/workflows/app-browser-smoke.yml"
  pull_request:
    paths:
      - "index.html"
      - "src/**"
      - "benchmarks/browser-spike/run-app-smoke.mjs"
      - ".github/workflows/app-browser-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  webkit-app-smoke:
    runs-on: macos-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: benchmarks/browser-spike
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: benchmarks/browser-spike/package.json
      - name: Install pinned browser test dependencies
        run: npm install --no-audit --no-fund
      - name: Install Playwright WebKit
        run: npx playwright install webkit
      - name: Test desktop and iPad-like modelling workflow
        run: node run-app-smoke.mjs
