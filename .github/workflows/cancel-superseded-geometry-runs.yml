name: Cancel superseded geometry benchmark runs

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/cancel-superseded-geometry-runs.yml"

permissions:
  actions: write

jobs:
  cancel-superseded-runs:
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - name: Cancel obsolete diagnostic and pre-fix runs
        uses: actions/github-script@v7
        with:
          script: |
            const runIds = [
              42383378424,
              42383381571,
              42383451118,
              42383576400,
              42383590690,
              42383648095
            ];

            for (const run_id of runIds) {
              try {
                await github.rest.actions.cancelWorkflowRun({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  run_id
                });
                core.info(`Cancellation requested for run ${run_id}`);
              } catch (error) {
                if (error.status === 404 || error.status === 409) {
                  core.info(`Run ${run_id} is already terminal or unavailable (HTTP ${error.status})`);
                } else {
                  throw error;
                }
              }
            }
